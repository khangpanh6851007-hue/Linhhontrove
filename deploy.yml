name: Deploy Ultra HD Web to GitHub Pages

on:
  push:
    branches: [ "main" ]

  # Cho phép kích hoạt thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Quyền hạn cho phép GitHub Actions đọc và ghi (cần thiết để deploy lên GitHub Pages)
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ định một tiến trình deploy đồng thời để tránh xung đột
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Thư mục chứa mã nguồn gốc của bạn (nếu index.html nằm ở thư mục gốc)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
