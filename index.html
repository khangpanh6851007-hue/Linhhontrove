<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tùng Phạt Chúng Sinh 5.0 - A Di Đà Phật</title>
    <style>
        :root {
            --bg-color: #0b0606;
            --gold: #f39c12;
            --gold-light: #f1c40f;
            --red-alert: #e74c3c;
            --text-main: #ecf0f1;
            --panel-bg: rgba(20, 10, 10, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: radial-gradient(circle, #2c1616 0%, #0b0606 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            width: 100%;
            max-width: 500px;
        }

        header h1 {
            color: var(--gold);
            font-size: 1.7rem;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        header p {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.2);
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--red-alert);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .stats-box h3 {
            font-size: 0.9rem;
            color: #e0e0e0;
            margin-bottom: 5px;
        }

        .phuoc-duc-score {
            font-size: 1.8rem;
            color: var(--gold-light);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--gold);
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--gold);
            outline: none;
        }

        .btn-punish {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: 0.2s;
            margin-top: 5px;
        }

        .btn-punish:active {
            transform: scale(0.98);
        }

        .log-section {
            margin-top: 20px;
            max-height: 180px;
            overflow-y: auto;
            background: #050303;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
        }

        .log-section h4 {
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 8px;
            border-bottom: 1px dashed #444;
            padding-bottom: 4px;
        }

        .log-item {
            font-size: 0.75rem;
            padding: 5px 0;
            border-bottom: 1px solid #1a1a1a;
            color: #ffcccc;
        }

        .log-item span {
            color: var(--gold);
            font-weight: bold;
        }

        footer {
            margin-top: 15px;
            font-size: 0.7rem;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>☸️ TÙNG PHẠT CHÚNG SINH 5.0</h1>
        <p>Nam Mô A Di Đà Phật - 20 Tội Danh Nghiệp Báo</p>
    </header>

    <div class="container">
        <div class="stats-box">
            <h3>KHO PHƯỚC ĐỨC CHUNG</h3>
            <div class="phuoc-duc-score" id="phuocScore">10,000,000</div>
        </div>

        <div class="form-group">
            <label for="sinnersName">Tên Chúng Sinh Vi Phạm:</label>
            <input type="text" id="sinnersName" placeholder="Nhập tên hoặc pháp danh...">
        </div>

        <div class="form-group">
            <label for="crimeType">Chọn 1 Trong 20 Tội Danh Nghiệp Báo:</label>
            <select id="crimeType">
                <!-- Nhóm Khẩu Nghiệp & Thân Nghiệp -->
                <option value="50000">1. Chửi rủa, thề thốt, khẩu nghiệp (-50,000 Phước)</option>
                <option value="100000">2. Nói dối, lừa gạt người thiện lương (-100,000 Phước)</option>
                <option value="80000">3. Nói lời ly gián, chia rẽ nội bộ (-80,000 Phước)</option>
                <option value="70000">4. Nói lời thô ác, cay độc mỉa mai (-70,000 Phước)</option>
                <option value="60000">5. Ba hoa, nói nhảm, vô ích (-60,000 Phước)</option>

                <!-- Nhóm Gia Đạo & Đạo Đức -->
                <option value="500000">6. Bạo lực gia đình, đánh đập người thân (-500,000 Phước)</option>
                <option value="400000">7. Bất hiếu với cha mẹ, cãi lời bề trên (-400,000 Phước)</option>
                <option value="350000">8. Bỏ bê con cái, không nuôi dưỡng gia đình (-350,000 Phước)</option>
                <option value="300000">9. Ngoại tình, tà dâm, phá hoại hạnh phúc gia đình (-300,000 Phước)</option>
                <option value="250000">10. Tranh chấp tài sản, kiện tụng người nhà (-250,000 Phước)</option>

                <!-- Nhóm Xã Hội & Tiền Tài -->
                <option value="200000">11. Trộm cắp, chiếm đoạt tài sản người khác (-200,000 Phước)</option>
                <option value="180000">12. Cờ bạc, cá độ, bán rẻ tương lai (-180,000 Phước)</option>
                <option value="150000">13. Buôn bán hàng giả, lừa lọc thương mại (-150,000 Phước)</option>
                <option value="120000">14. Vay mượn tiền không trả, xù nợ (-120,000 Phước)</option>
                <option value="110000">15. Ghen ghét, đố kỵ tài năng người khác (-110,000 Phước)</option>

                <!-- Nhóm Tội Nặng & Phá Hoại -->
                <option value="800000">16. Sát sinh hại vật, tàn sát dã man (-800,000 Phước)</option>
                <option value="600000">17. Phỉ báng Phật pháp, khinh nhờn Tam Bảo (-600,000 Phước)</option>
                <option value="450000">18. Vu khống, hãm hại người vô tội tù tội (-450,000 Phước)</option>
                <option value="700000">19. Buôn bán chất cấm, độc hại đầu độc xã hội (-700,000 Phước)</option>
                <option value="1000000">20. Đại ác nghiệp: Bất kính tôn sư, phản bội ơn nghĩa (-1,000,000 Phước)</option>
            </select>
        </div>

        <button class="btn-punish" onclick="executePunishment()">⚖️ THỰC THI THIÊN PHẠT</button>

        <div class="log-section">
            <h4>📜 Sổ Nam Tào (Lịch Sử Trừ Phước)</h4>
            <div id="logContainer">
                <div class="log-item">Hệ thống 5.0 (20 Tội Danh) đã sẵn sàng...</div>
            </div>
        </div>
    </div>

    <footer>
        © Bản Quyền Nam Mô A Di Đà Phật ® | Giao diện 5.0
    </footer>

    <script>
        let phuocDuc = 10000000;
        let violationCounts = {};

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function updateUI() {
            document.getElementById('phuocScore').innerText = formatNumber(phuocDuc);
        }

        function executePunishment() {
            const nameInput = document.getElementById('sinnersName');
            const crimeSelect = document.getElementById('crimeType');
            const logContainer = document.getElementById('logContainer');

            let sinner = nameInput.value.trim();
            if (!sinner) {
                sinner = "Vô danh chúng sinh";
            }

            // Lấy mức phạt cơ bản từ value của option được chọn
            let baseDeduction = parseInt(crimeSelect.value);
            let crimeText = crimeSelect.options[crimeSelect.selectedIndex].text;
            // Cắt bỏ phần điểm phước ở chuỗi hiển thị để lấy tên tội ngắn gọn
            let crimeName = crimeText.substring(crimeText.indexOf('.') + 2, crimeText.lastIndexOf('(')).trim();

            // Quản lý số lần vi phạm lũy tiến theo từng tội danh của chúng sinh
            if (!violationCounts[sinner]) {
                violationCounts[sinner] = {};
            }
            if (!violationCounts[sinner][crimeName]) {
                violationCounts[sinner][crimeName] = 0;
            }
            violationCounts[sinner][crimeName]++;
            let times = violationCounts[sinner][crimeName];

            // Tăng hệ số lũy tiến theo số lần phạm tội đó (nhân lên theo số lần)
            let actualDeduction = baseDeduction * times;

            // Trừ phước đức
            phuocDuc -= actualDeduction;
            if (phuocDuc < 0) phuocDuc = 0;

            updateUI();

            // Ghi log sổ Nam Tào
            const timeNow = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `[${timeNow}] <span>${sinner}</span> phạm tội: <b>${crimeName}</b> (Lần ${times}). Phật A Di Đà trừ <b>-${formatNumber(actualDeduction)}</b> Phước!`;
            
            logContainer.prepend(logItem);
            nameInput.value = "";
        }

        updateUI();
    </script>
</body>
</html>
